
name: Backend Django CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-check:
    name: Verification Django
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Check Django
        run: python manage.py check

  docker-publish:
    name: Build and Publish Backend
    runs-on: ubuntu-24.04
    needs: django-check
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USER" || {
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          }
          test -n "$DOCKER_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          }
          echo "Docker Hub secrets are available."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_backend:${{ github.sha }}
