
name: Backend Django CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-check:
    name: Vérification Django
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Vérifier la configuration Django
        run: python manage.py check

  docker-publish:
    name: Construire et publier l'image Backend
    runs-on: ubuntu-24.04

    needs: django-check

    # Ne pas publier lors d'une pull request
    if: github.event_name != 'pull_request'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Vérifier les secrets Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "::error::Le secret DOCKERHUB_USERNAME est absent ou vide."
            exit 1
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Le secret DOCKERHUB_TOKEN est absent ou vide."
            exit 1
          fi

          echo "Les deux secrets Docker Hub sont disponibles."

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion_hospitalisation_backend:${{ github.sha }}
